<style>
  /* Layout: the game fills the window (letterboxed to 16:9); the armory and touch controls overlay it. */
  :root {
    --bg: #15130f;
    --panel: #221f18;
    --panel-2: #2c2820;
    --line: #3a3528;
    --fg: #e9e1c9;
    --muted: #9a9077;
    --hazard: #e8b923;
    --cash: #9bd26a;
    --gold: #f4c430;
    --danger: #c4483b;
    --concrete: #6e6656;
    --pixel: "Press Start 2P", ui-monospace, monospace;
    --body: "Chakra Petch", system-ui, sans-serif;

  html, body { height: 100%; }
  body { margin: 0; background: #000; color: var(--fg); font-family: var(--body); overflow: hidden; }
  .wrap { position: fixed; inset: 0; display: grid; place-items: center; background: #000; }
  .screen {
    position: relative; overflow: hidden; background: #000;
    width: min(100vw, 177.78vh); height: min(100vh, 56.25vw);
    width: min(100vw, 177.78dvh); height: min(100dvh, 56.25vw);
  }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; cursor: crosshair; }
  .topbtns { position: absolute; top: 1.2%; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
  .topbtns button {
    font-family: var(--pixel); font-size: clamp(7px, 1vw, 10px); color: var(--fg); white-space: nowrap;
    background: rgba(16, 13, 10, .55); border: 1px solid var(--line); padding: 5px 8px; cursor: pointer; opacity: .55;
  }
  .topbtns button:hover, .topbtns button:focus-visible { opacity: 1; }
  .touch {
    display: none; position: absolute; left: 0; right: 0; bottom: 0; justify-content: space-between; align-items: flex-end;
    gap: 8px; padding: 2% max(2%, env(safe-area-inset-right, 0px)) max(2%, env(safe-area-inset-bottom, 0px)) max(2%, env(safe-area-inset-left, 0px));
    pointer-events: none; user-select: none; -webkit-user-select: none;
  }
  .touch .grp { display: flex; flex-wrap: wrap; gap: 5px; pointer-events: auto; max-width: 48%; }
  .touch .grp:last-child { justify-content: flex-end; }
  .touch button {
    font-family: var(--pixel); font-size: 10px; color: var(--fg); background: rgba(34, 31, 24, .55);
    border: 2px solid rgba(58, 53, 40, .8); border-bottom-width: 4px; width: clamp(34px, 7vw, 50px); height: clamp(34px, 7vw, 50px); touch-action: none; padding: 0;
  }
  .touch button.fire { background: rgba(196, 72, 59, .7); border-color: #7a2a22; width: clamp(46px, 9vw, 64px); }
  .touch button:active, .touch button.on { transform: translateY(2px); border-bottom-width: 2px; }
  button:focus-visible { outline: 2px solid var(--hazard); outline-offset: 2px; }
  @media (pointer: coarse) { .touch { display: flex; } }
  .shop:not([hidden]) ~ .touch, .shop:not([hidden]) ~ .topbtns,
  .pause:not([hidden]) ~ .touch, .pause:not([hidden]) ~ .topbtns { display: none; }

  /* pause menu */
  .pause {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: rgba(16, 13, 10, .82); text-align: center; padding: 16px; box-sizing: border-box;
  }
  .pause[hidden] { display: none; }
  .pause h2 { font-family: var(--pixel); font-size: clamp(14px, 3vw, 24px); color: var(--hazard); margin: 0 0 6px; }
  .pause p { margin: 0; font-size: 13px; color: var(--muted); max-width: 36ch; }
  .pause button, .shop-foot button.menu {
    font-family: var(--pixel); font-size: clamp(9px, 1.4vw, 12px); color: var(--fg); background: var(--panel-2);
    border: 1px solid var(--line); border-bottom-width: 3px; padding: 10px 16px; cursor: pointer; min-width: 14em;
  }
  .shop-foot button.menu { min-width: 0; font-size: 9px; padding: 9px 12px; }
  .pause button.go { background: var(--hazard); color: #1b1a16; border-color: #8a6d14; }

  /* armory */
  .shop {
    position: absolute; inset: 0; display: flex; flex-direction: column; gap: 8px;
    padding: 10px 12px; box-sizing: border-box;
    background: rgba(16, 13, 10, .95); cursor: default;
  }
  .shop[hidden] { display: none; }
  @media (max-width: 640px) {
    .shop {
      position: fixed; z-index: 20;
      padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
    }
  }
  .shop-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
  .shop h2 { font-family: var(--pixel); font-size: clamp(10px, 2vw, 15px); margin: 0 0 6px; color: var(--hazard); }
  .shop-sub { margin: 0; font-size: 13px; color: var(--muted); }
  .shop-cash { font-family: var(--pixel); font-size: clamp(11px, 2.2vw, 16px); color: var(--cash); font-variant-numeric: tabular-nums; }
  .loadout { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 520px) { .loadout { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .slot { background: var(--panel); border: 1px solid var(--hazard); padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .slot .lbl { font-family: var(--pixel); font-size: 8px; color: var(--hazard); }
  .slot .nm { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icon { height: 24px; max-width: 100%; object-fit: contain; object-position: left; image-rendering: pixelated; background: var(--concrete); padding: 3px 5px; align-self: flex-start; box-sizing: content-box; }
  .shop-grid {
    flex: 1; min-height: 0; overflow-y: auto; display: grid; gap: 8px;
    grid-template-columns: repeat(auto-fill, minmax(min(172px, 100%), 1fr)); align-content: start;
    border-top: 2px solid var(--line); padding-top: 8px;
  }
  .sec { grid-column: 1 / -1; font-family: var(--pixel); font-size: 9px; color: var(--muted); margin: 4px 0 0; letter-spacing: 1px; }
  .card { background: var(--panel); border: 1px solid var(--line); padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .card.equipped { border-color: var(--hazard); }
  .card-top { display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
  .card-name { font-family: var(--pixel); font-size: 9px; line-height: 1.4; }
  .card-tag { font-size: 10px; letter-spacing: .1em; color: var(--muted); white-space: nowrap; }
  .card-tag.up { color: var(--hazard); }
  .stats { display: grid; grid-template-columns: 40px 1fr; gap: 3px 6px; align-items: center; font-size: 11px; color: var(--muted); }
  .bar { height: 5px; background: #15130f; }
  .bar > i { display: block; height: 100%; background: var(--fg); }
  .btns { display: flex; gap: 4px; }
  .btns button { flex: 1; min-width: 0; }
  .card button, .shop-foot button {
    font-family: var(--pixel); font-size: 8px; color: var(--fg); background: var(--panel-2);
    border: 1px solid var(--line); border-bottom-width: 3px; padding: 7px 4px; cursor: pointer;
  }
  .card button.on { color: var(--hazard); border-color: var(--hazard); }
  .card button.buy { color: #10140c; background: var(--cash); border-color: #5d8a3a; }
  .card button.buy.gold { background: var(--gold); border-color: #a07a10; }
  .card-tag.goldtag, .sec.goldsec { color: var(--gold); }
  .shop-cash .gold { color: var(--gold); margin-left: 14px; }
  .card button:disabled { opacity: .45; cursor: not-allowed; }
  .card button.on:disabled { opacity: 1; cursor: default; }
  .shop-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; border-top: 2px solid var(--line); padding-top: 8px; font-size: 12px; color: var(--muted); }
  .shop-foot button.go { background: var(--hazard); color: #1b1a16; border-color: #8a6d14; font-size: 10px; padding: 9px 12px; }
</style>

<div class="wrap">

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
(() => {
const W = 320, H = 180;
const PX_PER_M = 16, GOAL_M = 5000, GOAL_X = GOAL_M * PX_PER_M;   // the safe zone at 5 km ends the game
const ROAD_TOP = 112, ROAD_BOT = 172;   // range of feet positions on the road
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
// characters are drawn into a layer, then snapped to hard pixel edges
const layer = Object.assign(document.createElement('canvas'), { width: W, height: H });
const L = layer.getContext('2d', { willReadFrequently: true });

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

// ---------- sound: everything is synthesized with Web Audio, no files ----------
const SFX = (() => {
  let ac = null, out = null, noise = null, muted = store.get('dm-mute') === '1';
  const last = {};
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume().catch(() => {}); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      ac = new AC();
      // a compressor lets gunfire be loud without clipping when several sounds stack
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 6;
      comp.connect(ac.destination);
      out = ac.createGain(); out.gain.value = muted ? 0 : .45; out.connect(comp);
      noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noise.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch { ac = null; }
  }
  // gap: minimum seconds between two plays of the same sound, so rapid fire doesn't stack into mush
  let boost = 1;   // gunfire plays through this multiplier so it sits above the rest of the mix
  const ok = (name, gap) => {
    if (!ac || muted || ac.state !== 'running') return false;
    const now = ac.currentTime;
    if (gap && now - (last[name] ?? -9) < gap) return false;
    last[name] = now; return true;
  };
  function burst(o) {
    const t = ac.currentTime + (o.delay || 0), dur = o.dur || .1;
    const src = ac.createBufferSource(); src.buffer = noise;
    const f = ac.createBiquadFilter(); f.type = o.type || 'lowpass'; f.frequency.setValueAtTime(o.freq || 1000, t); f.Q.value = o.q || .7;
    if (o.sweep) f.frequency.exponentialRampToValueAtTime(o.sweep, t + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(Math.max(.002, (o.vol || .3) * boost), t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    src.connect(f); f.connect(g); g.connect(out);
    src.start(t, Math.random() * .5); src.stop(t + dur + .05);
  }
  function tone(o) {
    const t = ac.currentTime + (o.delay || 0), dur = o.dur || .1;
    const osc = ac.createOscillator(); osc.type = o.wave || 'sine';
    osc.frequency.setValueAtTime(o.f0, t); if (o.f1) osc.frequency.exponentialRampToValueAtTime(o.f1, t + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(.002, (o.vol || .2) * boost), t + (o.att || .005)); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    let node = osc;
    if (o.lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; osc.connect(f); node = f; }
    node.connect(g); g.connect(out);
    osc.start(t); osc.stop(t + dur + .05);
  }
  const pv = () => .92 + Math.random() * .16;   // small pitch variation per shot
  return {
    init,
    get muted() { return muted; },
    toggle() { muted = !muted; store.set('dm-mute', muted ? '1' : '0'); if (out) out.gain.value = muted ? 0 : .45; return muted; },
    gun(g, vol = 1) {
      boost = 2.6 * vol;
      try { this.gunInner(g); } finally { boost = 1; }
    },
    gunInner(g) {
      if (g.flame) { if (ok('flame', .08)) burst({ type: 'bandpass', freq: 700, q: .5, dur: .14, vol: .12 }); return; }
      if (!ok('gun', .025)) return;
      const p = pv();
      if (g.tesla) { tone({ wave: 'square', f0: 1800 * p, f1: 240, dur: .16, vol: .12 }); burst({ type: 'highpass', freq: 3000, dur: .12, vol: .18 }); }
      else if (g.rail) { tone({ f0: 2600 * p, f1: 70, dur: .4, vol: .3 }); burst({ freq: 700, sweep: 80, dur: .35, vol: .5 }); }
      else if (g.arrow) { tone({ wave: 'triangle', f0: 230 * p, f1: 170, dur: .14, vol: .3 }); burst({ type: 'highpass', freq: 2500, dur: .04, vol: .15 }); }
      else if (g.rocket || g.launcher) {
        tone({ f0: 140 * p, f1: 40, dur: .28, vol: .5 }); burst({ freq: 600, sweep: 150, dur: .35, vol: .6 });
        if (g.rocket) burst({ type: 'bandpass', freq: 1500, sweep: 400, dur: .6, vol: .15, delay: .05 });
      }
      else if (g.flare) { burst({ type: 'bandpass', freq: 900 * p, dur: .14, vol: .4 }); tone({ f0: 420, f1: 200, dur: .12, vol: .15 }); }
      else if (g.pellets) { burst({ freq: 1100 * p, sweep: 180, dur: .32, vol: .9 }); tone({ f0: 95, f1: 40, dur: .22, vol: .5 }); }
      else if (g.big) { burst({ freq: 1800 * p, sweep: 140, dur: .5, vol: 1 }); tone({ f0: 75, f1: 32, dur: .35, vol: .6 }); }
      else if (g.slot === 'secondary') { burst({ type: 'bandpass', freq: 1700 * p, q: .9, dur: .1, vol: .6 }); tone({ f0: 210 * p, f1: 90, dur: .06, vol: .25 }); }
      else { burst({ type: 'bandpass', freq: 1300 * p, q: .8, dur: .09, vol: .5 }); tone({ f0: 160 * p, f1: 70, dur: .05, vol: .25 }); }
    },
    reload(g) {
      if (!ok('reload')) return;
      const T = g.reload, type = g.type || 'mag';
      const click = (d, f = 2400, v = .25) => {
        burst({ type: 'bandpass', freq: f, q: 2, dur: .035, vol: v, delay: d });
        tone({ wave: 'square', f0: f / 3, f1: f / 5, dur: .025, vol: .05, delay: d });
      };
      if (type === 'mag') { click(.05, 2200); click(T * .62, 1500, .35); burst({ type: 'bandpass', freq: 2600, sweep: 1200, dur: .09, vol: .25, delay: T * .85 }); }
      else if (type === 'rocket') click(T * .62, 900, .35);
      else if (type === 'break') { click(.05, 1800); click(T * .5, 2600, .15); click(T * .88, 1300, .4); }
      else { const n = Math.min(4, g.mag); for (let i = 0; i < n; i++) click(T * (.2 + .65 * i / n), 2000, .22); click(T * .9, 1400, .3); }
    },
    pump() { if (ok('pump')) { burst({ type: 'bandpass', freq: 1400, dur: .07, vol: .3, delay: .12 }); burst({ type: 'bandpass', freq: 1900, dur: .07, vol: .3, delay: .24 }); } },
    bolt() { if (ok('bolt')) { burst({ type: 'bandpass', freq: 2200, q: 2, dur: .05, vol: .25, delay: .15 }); burst({ type: 'bandpass', freq: 1600, q: 2, dur: .05, vol: .25, delay: .32 }); } },
    groan(z, near) {
      if (!ok('groan', .35)) return;
      const base = z.screamer ? 220 : z.heavy ? 48 : z.kind === 'runner' ? 120 : 70 + Math.random() * 35;
      tone({ wave: 'sawtooth', f0: base * pv(), f1: base * .75, dur: .5 + Math.random() * .4, vol: .09 * near, att: .12, lp: z.heavy ? 300 : 650 });
    },
    die(near) { if (ok('die', .1)) tone({ wave: 'sawtooth', f0: 110 + Math.random() * 40, f1: 50, dur: .55, vol: .12 * near, att: .02, lp: 700 }); },
    splat(near) { if (ok('splat', .04)) burst({ freq: 700, sweep: 200, dur: .09, vol: .28 * near }); },
    crunch(near) { if (ok('crunch', .05)) burst({ type: 'bandpass', freq: 900, sweep: 250, dur: .16, vol: .45 * near }); },
    ping() { if (ok('ping', .04)) tone({ wave: 'square', f0: 2400, f1: 1800, dur: .08, vol: .08 }); },
    scream() { if (ok('scream', .3)) { tone({ wave: 'sawtooth', f0: 650, f1: 1300, dur: .9, vol: .16, att: .05, lp: 2600 }); burst({ type: 'highpass', freq: 2500, dur: .8, vol: .08 }); } },
    roar() { if (ok('roar', .3)) { tone({ wave: 'sawtooth', f0: 70, f1: 38, dur: 1.1, vol: .4, att: .08, lp: 400 }); burst({ freq: 350, dur: 1, vol: .35 }); } },
    spit(near) { if (ok('spit', .1)) burst({ type: 'bandpass', freq: 650, sweep: 300, dur: .22, vol: .25 * near }); },
    // a single dull "oof" thump: no square wave, which buzzed and sounded like it repeated
    hurt() { if (ok('hurt', .3)) { burst({ freq: 420, dur: .16, vol: .7 }); tone({ f0: 240, f1: 120, dur: .14, vol: .25 }); } },
    boom(gas) { if (ok('boom', .04)) { burst({ freq: gas ? 700 : 1300, sweep: 60, dur: gas ? .8 : 1.1, vol: 1 }); tone({ f0: 62, f1: 28, dur: .7, vol: gas ? .4 : .8 }); } },
    bang() { if (ok('bang')) { burst({ freq: 3000, sweep: 300, dur: .5, vol: 1 }); tone({ f0: 3400, dur: 1.4, vol: .07, att: .01 }); } },
    ice() { if (ok('ice')) { burst({ type: 'highpass', freq: 3500, dur: .5, vol: .35 }); tone({ f0: 2200, f1: 3400, dur: .35, vol: .1 }); tone({ f0: 1600, f1: 2600, dur: .3, vol: .08, delay: .05 }); } },
    hiss() { if (ok('hiss')) burst({ type: 'bandpass', freq: 2500, sweep: 1200, dur: 1.4, vol: .3 }); },
    glass() { if (ok('glass')) { burst({ type: 'highpass', freq: 3200, dur: .25, vol: .4 }); burst({ freq: 500, sweep: 1500, dur: .5, vol: .25, delay: .05 }); } },
    beep() { if (ok('beep', .1)) tone({ wave: 'square', f0: 1250, dur: .12, vol: .09 }); },
    swing(m) {
      if (!ok('swing', .05)) return;
      if (m.saw) tone({ wave: 'sawtooth', f0: 95, f1: 120, dur: .18, vol: .14, lp: 1600 });
      else burst({ type: 'bandpass', freq: 900, sweep: 2200, dur: .16, vol: .18 });
    },
    thud() { if (ok('thud', .04)) { burst({ freq: 500, dur: .1, vol: .5 }); tone({ f0: 130, f1: 60, dur: .1, vol: .3 }); } },
    toss() { if (ok('toss')) burst({ type: 'bandpass', freq: 700, sweep: 1600, dur: .2, vol: .15 }); },
    buy() { if (ok('buy', .05)) { tone({ wave: 'square', f0: 880, dur: .08, vol: .07 }); tone({ wave: 'square', f0: 1320, dur: .12, vol: .07, delay: .08 }); } },
    coins() { if (ok('coins')) for (let i = 0; i < 5; i++) tone({ wave: 'triangle', f0: 1500 + i * 220, dur: .08, vol: .06, delay: i * .07 }); },
  };
})();

// ---------- colors ----------
const PAL = {
  helmet: [184, 173, 142], helmet_d: [143, 134, 107], goggle: [52, 50, 46],
  skin: [122, 74, 50], skin_d: [94, 54, 36], shirt: [143, 166, 196], shirt_d: [108, 132, 166],
  vest: [46, 52, 71], vest_l: [66, 74, 96], pack: [58, 65, 82], pack_d: [42, 47, 60],
  belt: [107, 90, 68], patch: [138, 58, 44], pants: [216, 210, 191], pants_d: [176, 169, 147],
  pad: [42, 53, 80], pad_l: [60, 74, 106], boot: [63, 67, 48], boot_d: [44, 47, 34], glove: [179, 154, 122],
};
const GUNCOL = { g: [30, 32, 38], l: [58, 61, 69], d: [22, 23, 27], w: [112, 72, 42], s: [170, 172, 178], o: [78, 82, 56], r: [96, 104, 70], x: [140, 40, 32], c: [90, 200, 230] };
const BLOOD = [128, 28, 20];
const BLOOD_D = [86, 16, 12], FLESH = [104, 18, 14], BONE = [228, 220, 198], BONE_D = [176, 166, 146];

const ankleOf = (hip, th, be) => polar(polar(hip, th, 14), th - be, 14);
function legPrims(b, hip, th, be, P, far, gear, torn, frac = 0) {
  const k = far ? c => dim(c) : c => c;
  const knee = polar(hip, th, 14), ankle = polar(knee, th - be, 14);
  b.seg(hip, knee, 6, k(P.pants), k(P.pants_d), true);
  if (torn) {

  } else b.seg(knee, ankle, 5, k(P.pants), k(P.pants_d), true);
  // shot-up legs: blood, then torn flesh, then bone
  if (frac > 0) b.seg(lerp(hip, knee, .35), lerp(hip, knee, .55), 3, k(BLOOD));
  if (frac >= .34) b.seg(lerp(knee, ankle, .2), lerp(knee, ankle, .7), 3, k(FLESH));
  if (frac >= .6) b.seg(lerp(knee, ankle, .25), lerp(knee, ankle, .65), 1.5, k(BONE));
  if (gear) {
    const m = lerp(hip, knee, .5);
    b.rect(m[0] - 2, m[1] - 1, m[0] + 1, m[1] + 2, k(P.pad));
    b.rect(knee[0] - 2, knee[1] - 2, knee[0] + 2, knee[1] + 2, k(P.pad));
    b.rect(knee[0] - 1, knee[1] - 2, knee[0] + 1, knee[1] - 1, k(P.pad_l));

function p2pJoin(code, asHost) {
  return new Promise((resolve, reject) => {
    const id = 'deadmile-' + code.toLowerCase();
    const peer = asHost ? new Peer(id) : new Peer();
    const conns = new Map(), others = new Map();
    let mine = {}, handler = null, myId = '', settled = false;
    const done = (ok, v) => { if (settled) return; settled = true; if (ok) resolve(v); else { try { peer.destroy(); } catch {} reject(v); } };
    const emit = () => handler && handler({ peers: [{ peer: myId, isMe: true, sameTab: true, presence: mine },
      ...[...others].map(([p, presence]) => ({ peer: p, isMe: false, sameTab: false, presence }))] });
    const send = (conn, msg) => { try { if (conn.open) conn.send(msg); } catch {} };
    const game = {
      presence(patch) {
        mine = { ...mine, ...patch };
        for (const c of conns.values()) send(c, { t: 'p', from: myId, p: mine });
        return Promise.resolve();
      },
      onPeers(fn) { handler = fn; setTimeout(emit, 0); return () => { handler = null; }; },
      leave() { try { peer.destroy(); } catch {} return Promise.resolve(); },
    };
    const wire = conn => {
      conn.on('open', () => {
        conns.set(conn.peer, conn);
        if (asHost) { send(conn, { t: 'p', from: myId, p: mine }); for (const [from, p] of others) send(conn, { t: 'p', from, p }); }
        else done(true, game);
      });
      conn.on('data', d => {
        if (!d || typeof d !== 'object') return;
        if (d.t === 'gone') { others.delete(String(d.from)); emit(); return; }
        if (d.t !== 'p' || !d.p || typeof d.p !== 'object') return;
        const from = asHost ? conn.peer : String(d.from || conn.peer);   // the host knows who sent it
        if (from === myId) return;
        others.set(from, d.p);
        if (asHost) for (const c of conns.values()) if (c !== conn) send(c, { t: 'p', from, p: d.p });
        emit();
      });
      conn.on('close', () => {
        conns.delete(conn.peer);
        if (asHost) { others.delete(conn.peer); for (const c of conns.values()) send(c, { t: 'gone', from: conn.peer }); }
        else others.clear();   // the host is gone
        emit();
      });
    };
    peer.on('open', pid => {
      myId = pid;
      if (asHost) done(true, game);
      else wire(peer.connect(id, { reliable: true }));
    });
    if (asHost) peer.on('connection', wire);
    peer.on('error', err => done(false, err));
    setTimeout(() => done(false, new Error('timeout')), 12000);
  });
}

function onGamePeers(ch) {

    const s = p.presence;
    if (!s || !s.p || typeof s.p.x !== 'number') continue;
    live.add(p.peer);
    let r = NET.remotes.get(p.peer);
    if (!r) {
      r = { peer: p.peer, x: s.p.x, y: s.p.y, anim: 0, speed: 0, inv: 0, flash: 0, n: NET.remotes.size + 2 };
      r.pal = { ...PAL, shirt: TEAM[(r.n - 2) % TEAM.length], shirt_d: dim(TEAM[(r.n - 2) % TEAM.length], .78) };
      NET.remotes.set(p.peer, r);

    if (s.r === 'h') { NET.hostPeer = p.peer; if (isGuest()) applySnapshot(s); }

    state = 'over'; banner = { txt: 'HOST LEFT', sub: '', t: 4 };

}

    ctx.fillStyle = 'rgba(16,10,10,.55)'; ctx.fillRect(0, 18, W, 78);
    text('DEAD MILE', W / 2, 26, 16, '#e8b923', 'center');
    text('5 KM TO SAFETY. THEY ARE IN THE WAY.', W / 2, 48, 8, '#e9e1c9', 'center');
    if (titleSave) {
      if (Math.floor(t * 2) % 2) text('ENTER / CLICK: CONTINUE', W / 2, 60, 8, '#fff', 'center');
      text('WAVE ' + titleSave.wave + ' AT ' + (titleSave.x / PX_PER_M / 1000).toFixed(2) + ' KM  N: NEW RUN', W / 2, 70, 8, '#9bd26a', 'center');
    } else if (Math.floor(t * 2) % 2) text('PRESS ENTER / CLICK', W / 2, 62, 8, '#fff', 'center');
    text('REACH THE SAFE ZONE AT 5 KM', W / 2, 84, 8, '#e8b923', 'center');
    if (codeEntry !== null) {
      ctx.fillStyle = 'rgba(16,10,10,.7)'; ctx.fillRect(0, 118, W, 34);
      text('FRIEND\'S CODE: ' + codeEntry.padEnd(4, '_'), W / 2, 124, 8, '#9bd26a', 'center');
      text('ENTER TO JOIN / ESC TO CANCEL', W / 2, 138, 8, '#d8d2bf', 'center');
    } else if (NET.room || NET.p2p) {
      text('H: HOST CO-OP   J: JOIN BY CODE', W / 2, 132, 8, '#8ab4e0', 'center');
      if (NET.games.length) text('OPEN: ' + NET.games.map((g, i) => (i + 1) + ' ' + g.code + ' W' + g.wave).join('  '), W / 2, 142, 8, '#9bd26a', 'center');
    }
    if (titleMsg) text(titleMsg, W / 2, 104, 8, '#f08a6a', 'center');
    // controls live on the title screen now that the game fills the window
    if (!touchMode) {
      text('WASD MOVE / CLICK SHOOT / R RELOAD', W / 2, 156, 8, '#d8d2bf', 'center');
      text('Q SWAP / E MELEE / G NADE / M MUTE', W / 2, 166, 8, '#d8d2bf', 'center');
    }
    if (best) text('BEST: WAVE ' + best, 6, 6, 8, '#d8d2bf');
    return;
  }

  for (const p of pops) text(p.txt, clamp(Math.round(p.x - camX), 40, W - 40), Math.round(p.y), 8, p.c, 'center');
  // HUD
  for (let i = 0; i < 6; i++) {
    ctx.fillStyle = '#000'; ctx.fillRect(8 + i * 11, 8, 9, 7);
    ctx.fillStyle = i < P.hp ? '#c4483b' : '#3a3528'; ctx.fillRect(9 + i * 11, 9, 7, 5);
  }
  text('$' + bank, 8, 20, 8, '#9bd26a');
  const nd = NADES[P.nadeType], nc = P.nadeCount[P.nadeType];
  ctx.fillStyle = rgb(nd.col); ctx.fillRect(9, 33, 4, 5); ctx.fillStyle = rgb(nd.top); ctx.fillRect(10, 31, 2, 2);
  text('x' + nc, 16, 31, 8, nc ? '#e9e1c9' : '#6a6050');
  ctx.fillStyle = '#f4c430'; ctx.fillRect(43, 32, 5, 5); ctx.fillStyle = '#a07a10'; ctx.fillRect(44, 36, 4, 1);
  text(String(P.gold), 51, 31, 8, '#f4c430');
  const boss = zombies.find(z => z.boss && z.state !== 'dead');
  if (boss) {
    const f = clamp(Math.min(boss.hp.torso / boss.maxHp.torso, boss.hp.head / boss.maxHp.head), 0, 1);
    text('THE TANK', W / 2, 20, 8, '#c4483b', 'center');
    ctx.fillStyle = '#000'; ctx.fillRect(W / 2 - 61, 30, 122, 6);
    ctx.fillStyle = '#3a1410'; ctx.fillRect(W / 2 - 60, 31, 120, 4);
    ctx.fillStyle = '#c4483b'; ctx.fillRect(W / 2 - 60, 31, Math.round(120 * f), 4);
  }
  text('WAVE ' + wave, W - 8, 8, 8, '#e8b923', 'right');
  text('LEFT ' + (isGuest() ? NET.left : toSpawn + alive()), W - 8, 20, 8, '#d8d2bf', 'right');
  if (NET.mode !== 'solo') text('CO-OP ' + NET.code + ' ' + (NET.remotes.size + 1) + 'P', 8, 42, 8, '#8ab4e0');
  // distance to the safe zone
  const km = clamp(P.x / PX_PER_M / 1000, 0, GOAL_M / 1000);
  text(km.toFixed(2) + '/5 KM', W - 8, 31, 8, '#9bd26a', 'right');
  ctx.fillStyle = '#000'; ctx.fillRect(W - 69, 41, 61, 4);
  ctx.fillStyle = '#9bd26a'; ctx.fillRect(W - 68, 42, Math.round(59 * km / (GOAL_M / 1000)), 2);
  const g = cur(), other = GUNS[P.guns[P.slot === 'primary' ? 'secondary' : 'primary']];
  text(g.name, 8, 156, 8, '#e9e1c9');
  if (P.reload > 0) {
    ctx.fillStyle = '#000'; ctx.fillRect(8, 168, 62, 6);
    ctx.fillStyle = '#e8b923'; ctx.fillRect(9, 169, Math.round(60 * (1 - P.reload / P.reloadMax)), 4);
    text('RELOADING', 76, 167, 8, '#e8b923');
  } else {
    const m = P.mag[gunId()];
    text(m + ' / ' + g.mag, 8, 167, 8, m === 0 ? '#c4483b' : m <= g.mag * .25 ? '#e8b923' : '#e9e1c9');
    if (g.spin && fire() && P.spinUp < 1) text('SPINNING UP', 92, 167, 8, '#e8b923');
  }
  text('Q ' + other.name, W - 8, 156, 8, '#9a9077', 'right');
  text('E ' + MELEE[P.melee].name, W - 8, 167, 8, '#9a9077', 'right');
  if (state === 'play' && mouse.active) {
    const mx = Math.round(mouse.x), my = Math.round(mouse.y);
    ctx.fillStyle = 'rgba(255,240,200,.85)';
    ctx.fillRect(mx - 4, my, 3, 1); ctx.fillRect(mx + 2, my, 3, 1); ctx.fillRect(mx, my - 4, 1, 3); ctx.fillRect(mx, my + 2, 1, 3);
  }
  if (state === 'play' && banner) {
    text(banner.txt, W / 2, 40, 16, '#e8b923', 'center');
    if (banner.sub) text(banner.sub, W / 2, 62, 8, '#e9e1c9', 'center');
  }
  if (state === 'payout') {
    // cash earned this wave counts up over three seconds
    const k = Math.min(1, payT / 3), shown = Math.round(pending * (1 - Math.pow(1 - k, 3)));
    ctx.fillStyle = 'rgba(16,10,10,.6)'; ctx.fillRect(0, 40, W, 74);
    text('WAVE ' + wave + ' CLEAR', W / 2, 48, 8, '#e8b923', 'center');
    text('+$' + shown + ' CASH', W / 2, 64, 16, '#9bd26a', 'center');
    if (pendingGold) text('+' + pendingGold + ' GOLD', W / 2, 86, 8, '#f4c430', 'center');
    if (k >= 1) text('HEADING TO THE ARMORY...', W / 2, 100, 8, '#d8d2bf', 'center');
  }
  if (state === 'over') {
    ctx.fillStyle = 'rgba(16,10,10,.65)'; ctx.fillRect(0, 36, W, 88);
    text('OVERRUN', W / 2, 46, 16, '#c4483b', 'center');
    text('WAVE ' + wave + '   KILLS ' + kills, W / 2, 72, 8, '#e9e1c9', 'center');
    text((P.x / 16 / 1000).toFixed(2) + ' KM   BEST: WAVE ' + best, W / 2, 86, 8, '#e9e1c9', 'center');
    if (Math.floor(t * 2) % 2) text('ENTER / CLICK: MAIN MENU', W / 2, 106, 8, '#fff', 'center');
  }
  if (state === 'won') {
    ctx.fillStyle = 'rgba(10,20,12,.75)'; ctx.fillRect(0, 36, W, 92);
    text('YOU MADE IT', W / 2, 46, 16, '#9bd26a', 'center');
    text('5 KM TO THE SAFE ZONE', W / 2, 70, 8, '#e9e1c9', 'center');
    text('WAVE ' + wave + '   KILLS ' + kills, W / 2, 84, 8, '#e9e1c9', 'center');
    if (Math.floor(t * 2) % 2) text('ENTER / CLICK: MAIN MENU', W / 2, 108, 8, '#fff', 'center');
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  // one bad frame must never stop the game loop
  try {
    if (!paused || NET.mode !== 'solo') update(dt);   // solo freezes while paused; co-op can't
    draw();
  } finally { requestAnimationFrame(loop); }
}
title();
const go = () => requestAnimationFrame(loop);
document.fonts ? document.fonts.load('8px "Press Start 2P"').finally(go) : go();
})();
</script>
